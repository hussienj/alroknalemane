<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تنبيه: تعطيل الحساب</title>
<style>
  :root {
    --bg: #f3f5fa;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #5b6577;
    --accent: #c0392b;
    --accent-soft: #fdecea;
    --wa: #1faa59;
    --wa-hover: #178a47;
    --border: #e1e5ee;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --card: #1b2030; --text: #eef1f7; --muted: #a3adc0;
      --accent: #ff7b6b; --accent-soft: #3a1f1f; --border: #2c3348;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --card: #1b2030; --text: #eef1f7; --muted: #a3adc0;
    --accent: #ff7b6b; --accent-soft: #3a1f1f; --border: #2c3348;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif; line-height: 1.9;
  }
  .card {
    width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 32px 26px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
  }
  .icon {
    width: 76px; height: 76px; margin: 0 auto 16px; border-radius: 50%;
    background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 38px;
  }
  h1 { margin: 0 0 14px; font-size: 1.5rem; color: var(--accent); }
  p { margin: 0 0 12px; font-size: 1.05rem; }
  .muted { color: var(--muted); }
  .contact {
    margin-top: 22px; padding: 18px; border: 1px dashed var(--border); border-radius: 14px;
  }
  .contact small { display: block; color: var(--muted); margin-bottom: 6px; }
  .num {
    display: block; font-size: 1.6rem; font-weight: 700; letter-spacing: 1px;
    direction: ltr; unicode-bidi: plaintext; margin-bottom: 14px;
  }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 12px;
    border: 0; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
    transition: background .2s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .wa { background: var(--wa); color: #fff; }
  .wa:hover { background: var(--wa-hover); }
  .copy { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .copy:hover { background: var(--bg); }
  .thanks { margin-top: 22px; font-weight: 600; }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">🔒</div>
    <h1>تنبيه: تم تعطيل الحساب</h1>
    <p>أستاذنا الكريم،</p>
    <p>لقد تم تعطيل حسابكم الخاص. نلفت انتباهكم إلى ضرورة تسديد ما بذمتكم من مبالغ مالية، ولمرة واحدة، لتتمكنوا من العمل على تطبيق مدرستكم.</p>

    <div class="contact">
      <small>رقم الموبايل (واتساب)</small>
      <span class="num" id="phone">07807936026</span>
      <div class="btns">
        <a class="btn wa" href="https://wa.me/9647807936026" target="_blank" rel="noopener">💬 تواصل عبر واتساب</a>
        <button class="btn copy" id="copyBtn" type="button">📋 نسخ الرقم</button>
      </div>
    </div>

    <p class="thanks">وشكرًا لكم</p>
  </main>

<script>
  const btn = document.getElementById('copyBtn');
  btn.addEventListener('click', async () => {
    const num = document.getElementById('phone').textContent.trim();
    try {
      await navigator.clipboard.writeText(num);
      btn.textContent = '✅ تم النسخ';
    } catch (e) {
      const r = document.createRange();
      r.selectNodeContents(document.getElementById('phone'));
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = 'حدد الرقم وانسخه';
    }
    setTimeout(() => btn.textContent = '📋 نسخ الرقم', 2000);
  });
</script>
</body>
</html>
